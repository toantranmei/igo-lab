<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 336" width="828" height="336"><rect width="828" height="336" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="24" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Ba tầng phát hành</text><text x="24" y="50" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Tầng do hệ thống tính từ mức chặt chẽ và các cổng. Không ai nâng tầng bằng chấp thuận.</text><rect x="104.0" y="70" width="620" height="70" rx="8" fill="#e6f0fb" stroke="#2a78d6"/><text x="120.0" y="94" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Quyết định nhân sự</text><text x="120.0" y="113" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Mức A · như tầng Sản phẩm · thêm G11 (kiểm định theo hiệu suất) và G12 (công bằng giữa các nhóm)</text><text x="120.0" y="130" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Dùng cho: Tuyển chọn, thăng tiến, lương thưởng trong phạm vi đã kiểm định</text><rect x="64.0" y="154" width="700" height="70" rx="8" fill="#eef5fc" stroke="#2a78d6"/><text x="80.0" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Sản phẩm thị trường</text><text x="80.0" y="197" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Mức ≥ B · G6 và G7 đạt bằng dữ liệu · không cổng nào trong G1, G3–G7 qua bằng phiếu sai lệch</text><text x="80.0" y="214" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Dùng cho: Phát triển, định hướng, đánh giá phục vụ phát triển ở khách hàng</text><rect x="24.0" y="238" width="780" height="70" rx="8" fill="#f6f9fd" stroke="#2a78d6"/><text x="40.0" y="262" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Nội bộ</text><text x="40.0" y="281" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Mức C, hoặc có cổng đạt bằng phiếu sai lệch</text><text x="40.0" y="298" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Dùng cho: Phát triển nội bộ, thư viện, bản nháp sản phẩm</text></svg>