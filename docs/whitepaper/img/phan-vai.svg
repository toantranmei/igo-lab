<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 881 382" width="881" height="382"><rect width="881" height="382" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="24" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Ba loại việc trong dây chuyền tự động</text><text x="24" y="50" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Agent kiểm chéo dùng model khác agent thực hiện và không nhìn thấy kết quả của agent đó.</text><rect x="24" y="66" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="84" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Bước</text><rect x="170" y="66" width="285" height="26" rx="5" fill="#e6f0fb" stroke="#2a78d6"/><text x="180" y="84" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Code tính</text><rect x="461" y="66" width="185" height="26" rx="5" fill="#fdebe3" stroke="#eb6834"/><text x="471" y="84" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="start">AI thực hiện</text><rect x="652" y="66" width="205" height="26" rx="5" fill="#e2f5ee" stroke="#1baf7a"/><text x="662" y="84" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="start">AI độc lập kiểm chéo</text><rect x="24" y="98" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="115" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B0 Khởi tạo</text><rect x="170" y="98" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="115" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Kiểm đủ trường, khóa snapshot</text><rect x="461" y="98" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="115" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text><rect x="652" y="98" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="115" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text><rect x="24" y="128" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="145" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B1 Chấm JD</text><rect x="170" y="128" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="145" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Khử trùng, che dữ liệu cá nhân, tính L, M, hạng</text><rect x="461" y="128" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="145" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Đọc JD, chấm tiêu chí</text><rect x="652" y="128" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="145" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text><rect x="24" y="158" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="175" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B2 Neo nghề</text><rect x="170" y="158" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="175" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Tra danh mục, quy thang 1–5</text><rect x="461" y="158" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="175" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Chọn nghề gần nhất</text><rect x="652" y="158" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="175" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text><rect x="24" y="188" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="205" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B3 Mã hóa</text><rect x="170" y="188" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="205" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">So thư viện, gom sơ bộ, trọng số, kappa</text><rect x="461" y="188" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="205" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Trích, duyệt cụm</text><rect x="652" y="188" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="205" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Mã hóa lại 20% số câu</text><rect x="24" y="218" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="235" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B4 Hành vi thật</text><rect x="170" y="218" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="235" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Khử nhận dạng, đếm mẫu</text><rect x="461" y="218" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="235" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Gán sự kiện cho ứng viên</text><rect x="652" y="218" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="235" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text><rect x="24" y="248" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="265" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B5 Chọn, đặt bậc</text><rect x="170" y="248" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="265" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Trung bình, rwg, quy tắc giữ/loại, độ phủ</text><rect x="461" y="248" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="265" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Lập ma trận nhiệm vụ</text><rect x="652" y="248" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="265" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Ba ghế chấm ưu tiên và bậc</text><rect x="24" y="278" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="295" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B6 Viết thẻ</text><rect x="170" y="278" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="295" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Kiểm tự động, tỷ lệ đúng, Fleiss kappa</text><rect x="461" y="278" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="295" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Soạn chỉ báo</text><rect x="652" y="278" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="295" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Ba ghế dịch ngược, xếp lớp</text><rect x="24" y="308" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="325" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B7 Thẩm định</text><rect x="170" y="308" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="325" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Tổng hợp cổng, lấy mẫu 10%</text><rect x="461" y="308" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="325" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text><rect x="652" y="308" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="325" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Agent thẩm định 10 biến</text><rect x="24" y="338" width="140" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="34" y="355" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">B8 Lập hồ sơ</text><rect x="170" y="338" width="285" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="180" y="355" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">So với từ điển nền, đề xuất phiên bản</text><rect x="461" y="338" width="185" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="471" y="355" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text><rect x="652" y="338" width="205" height="26" rx="5" fill="#fff" stroke="#d9d8d3"/><text x="662" y="355" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">—</text></svg>