<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 304" width="800" height="304"><rect width="800" height="304" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="24" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Kiến trúc hệ thống</text><text x="24" y="50" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Chỉ worker gọi AI. Chỉ sổ đăng ký ghi vào từ điển.</text><rect x="24" y="90" width="150" height="70" rx="8" fill="#fff" stroke="#d9d8d3"/><text x="99.0" y="118" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Người dùng</text><text x="99.0" y="138" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">Trình duyệt, phiếu riêng</text><rect x="214" y="90" width="160" height="70" rx="8" fill="#fff" stroke="#d9d8d3"/><text x="294.0" y="118" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Web</text><text x="294.0" y="138" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">Màn hình, API. Không gọi AI</text><rect x="414" y="90" width="170" height="70" rx="8" fill="#fff" stroke="#d9d8d3"/><text x="499.0" y="118" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Cơ sở dữ liệu</text><text x="499.0" y="138" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">Phiên, bằng chứng, từ điển, nhật ký</text><rect x="624" y="90" width="150" height="70" rx="8" fill="#fff" stroke="#d9d8d3"/><text x="699.0" y="118" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Worker</text><text x="699.0" y="138" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">Chạy từng bước, tính cổng</text><rect x="624" y="210" width="150" height="70" rx="8" fill="#fff" stroke="#d9d8d3"/><text x="699.0" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Claude</text><text x="699.0" y="258" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">Một lời gọi, không công cụ</text><line x1="176" y1="125" x2="212" y2="125" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><line x1="376" y1="125" x2="412" y2="125" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><line x1="622" y1="125" x2="586" y2="125" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><line x1="699" y1="162" x2="699" y2="208" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><rect x="214" y="210" width="370" height="70" rx="8" fill="#f3f2ee" stroke="#d9d8d3"/><text x="399" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Sổ đăng ký từ điển</text><text x="399" y="258" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">Một cửa ghi: kiểm nền, cấp mã, ghim phiên bản, bản phát hành</text><line x1="499" y1="162" x2="499" y2="208" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><text x="24" y="236" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">Nguyên tắc</text><text x="24" y="256" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Code tính · AI gợi ý</text><text x="24" y="274" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Người quyết định</text></svg>