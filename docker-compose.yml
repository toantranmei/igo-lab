name: competence-lab
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cl_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-cl_owner_dev}
      POSTGRES_DB: competence_lab
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5570}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cl_owner -d competence_lab"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_OWNER_URL: postgres://cl_owner:${POSTGRES_OWNER_PASSWORD:-cl_owner_dev}@postgres:5432/competence_lab
      CL_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-cl_app_dev}
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["app"]

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    environment:
      ROLE: web
      DATABASE_URL: postgres://cl_app:${POSTGRES_APP_PASSWORD:-cl_app_dev}@postgres:5432/competence_lab
      DATA_DIR: /data
      HOST: 0.0.0.0 # inside the container only; the port is published on 127.0.0.1 below
      LOCAL_ACTOR_PERMISSIONS: ${LOCAL_ACTOR_PERMISSIONS:-VIEW,OPERATE,APPROVE,BACKUP_ADMIN}
    ports:
      # No login yet: publish on loopback only. Put an authenticating proxy in front before exposing it.
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    volumes:
      - appdata:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ["app"]

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    environment:
      ROLE: worker
      DATABASE_URL: postgres://cl_app:${POSTGRES_APP_PASSWORD:-cl_app_dev}@postgres:5432/competence_lab
      DATA_DIR: /data
      # Long-lived token from `claude setup-token`. Only this container receives it.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - appdata:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ["app"]

volumes:
  pgdata:
  appdata:
